apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: node:18-alpine
        ports:
        - containerPort: 3001
        command:
        - /bin/sh
        - -c
        - |
          # Installer les dépendances et démarrer un serveur simple
          npm install express pg
          cat > server.js << 'SERVER'
          const express = require('express');
          const { Pool } = require('pg');
          const app = express();
          const port = 3001;

          const pool = new Pool({
            host: process.env.DB_HOST || 'postgres-primary',
            port: process.env.DB_PORT || 5432,
            user: process.env.DB_USER || 'admin',
            password: process.env.DB_PASSWORD || 'password123',
            database: process.env.DB_NAME || 'ecommerce'
          });

          app.use(express.json());

          app.get('/health', async (req, res) => {
            try {
              await pool.query('SELECT 1');
              res.json({ status: 'OK', service: 'user-service', database: 'connected' });
            } catch (error) {
              res.status(500).json({ status: 'ERROR', service: 'user-service', error: error.message });
            }
          });

          app.get('/users', async (req, res) => {
            try {
              const result = await pool.query('SELECT * FROM users');
              res.json({ users: result.rows, count: result.rowCount });
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });

          app.listen(port, () => {
            console.log(\`User service démarré sur le port \${port}\`);
          });
          SERVER
          node server.js
        env:
        - name: DB_HOST
          value: "postgres-primary"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "password123"
        - name: DB_NAME
          value: "ecommerce"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
