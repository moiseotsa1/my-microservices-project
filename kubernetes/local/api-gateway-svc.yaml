apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  labels:
    app: api-gateway
spec:
  # Le sélecteur doit correspondre aux labels de vos Pods de l'API Gateway
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080      # Le port du Service K8s (pour la communication interne)
      targetPort: 8080 # Le port sur lequel le conteneur du Pod écoute
      nodePort: 32000 # Le port exposé sur chaque Node du cluster (pour l'accès externe)
  type: NodePort
