apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-read-replica
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-read-replica
  template:
    metadata:
      labels:
        app: postgres-read-replica
    spec:
      containers:
      - name: postgres
        image: postgres:13-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "password123"
        - name: POSTGRES_DB
          value: "ecommerce"
        - name: POSTGRES_HOST
          value: "postgres-primary"
        command:
        - bash
        - -c
        - |
          # Attendre que le primary soit prêt
          until pg_isready -h postgres-primary -p 5432 -U admin -d ecommerce; do
            echo "En attente du primary PostgreSQL..."
            sleep 5
          done
          echo "Replica PostgreSQL prêt - Mode lecture seule simulé"
          # Pour l'instant, nous simulons un replica
          tail -f /dev/null
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
