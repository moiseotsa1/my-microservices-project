name: Validate Microservices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    name: ÌøóÔ∏è Validate Project Structure
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate Microservices
      run: |
        echo "Ì¥ç Validation de l'architecture microservices..."
        echo "=============================================="
        
        # V√©rification de la structure
        echo ""
        echo "Ì≥Å Structure racine:"
        ls -la
        
        echo ""
        echo "ÌøóÔ∏è Dossier microservices:"
        if [ -d "microservices" ]; then
          echo "‚úÖ Dossier microservices trouv√©"
          echo "Ì≥ã Services d√©tect√©s:"
          ls microservices/
        else
          echo "‚ùå Dossier microservices manquant"
          exit 1
        fi
        
        echo ""
        echo "Ìºê Frontends:"
        if ls *.html > /dev/null 2>&1; then
          echo "‚úÖ Fichiers HTML trouv√©s:"
          ls *.html
        else
          echo "‚ö†Ô∏è Aucun fichier HTML"
        fi
        
