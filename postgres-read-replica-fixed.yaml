apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-read-replica
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-read-replica
  template:
    metadata:
      labels:
        app: postgres-read-replica
    spec:
      containers:
      - name: postgres
        image: postgres:13-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "password123"
        - name: POSTGRES_DB
          value: "ecommerce_replica"
        command:
        - bash
        - -c
        - |
          # Démarrer PostgreSQL normalement (instance séparée)
          echo "Démarrage PostgreSQL Replica (instance séparée)"
          exec docker-entrypoint.sh postgres
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
